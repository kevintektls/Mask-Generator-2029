[package]
name = "lidarcontrol"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
csv = "1"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
gilrs = "0.11"
