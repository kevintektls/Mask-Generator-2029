# Defaults match the working D500 reader in scripts/Behavioral_Cloning_Lidar.py.
lidar_port = "/dev/ttyTHS1"
lidar_baud = 230400
scan_log = "lidarcontrol/data/scan.jsonl"
map_resolution_m = 0.05
camera_bridge_addr = "127.0.0.1:9010"
camera_output = "lidarcontrol/data/camera"
camera_sync_tolerance_ms = 80
localization_min_confidence = 0.30
safety_margin_m = 0.25
obstacle_stop_distance_m = 0.30
simulation_speed_mps = 0.20
