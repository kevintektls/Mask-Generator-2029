[workspace]
resolver = "2"
members = [
    "crates/autopilot-config",
    "crates/autopilot-vision",
    "crates/autopilot-model",
    "crates/autopilot-vesc",
    "crates/autopilot-input",
    "crates/autopilot-camera",
    "crates/autopilot-stream",
    "autopilot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mask-Generator-2029"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

candle-core = "0.8"
candle-nn = "0.8"

serialport = "4"
vesc = "0.4"

gilrs = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

depthai = "0.1.3"

autopilot-config = { path = "crates/autopilot-config" }
autopilot-vision = { path = "crates/autopilot-vision" }
autopilot-model = { path = "crates/autopilot-model" }
autopilot-vesc = { path = "crates/autopilot-vesc" }
autopilot-input = { path = "crates/autopilot-input" }
autopilot-camera = { path = "crates/autopilot-camera" }
autopilot-stream = { path = "crates/autopilot-stream" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
