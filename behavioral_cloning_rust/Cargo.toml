[package]
name = "behavioral-cloning-lidar"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
ctrlc = "3"
gilrs = "0.11"
lidarcontrol = { path = "../lidarcontrol" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
